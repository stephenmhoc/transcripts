# Run from /opt/transcripts with app/ checkout, private .env and owned data/.
# Both published ports bind ONLY loopback. The private TLS proxy must itself
# bind ONLY to a private interface such as the host's Tailscale IP.
services:
  transcripts:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile
    container_name: transcripts
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /data
      TRANSCRIPTS_ENV: /nonexistent
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8765/healthz',headers={'Host':__import__('urllib.parse',fromlist=['urlsplit']).urlsplit(os.environ['APP_ORIGIN']).netloc}); urllib.request.urlopen(r,timeout=5).read()"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
  transcript-shares:
    profiles: [sharing]
    build:
      context: ./app
      dockerfile: deploy/Dockerfile
    container_name: transcript-shares
    command: [transcripts, public, --host, 0.0.0.0, --port, '8767', --directory, /public]
    restart: unless-stopped
    init: true
    # Deliberately NO env_file, owner token, Overcast cookie or private DB.
    environment:
      PUBLIC_DATA_DIR: /public
    ports:
      - "127.0.0.1:8767:8767"
    volumes:
      - ./data/public:/public:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      transcripts:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
