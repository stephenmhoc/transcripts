[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meritranscripts"
version = "0.1.0"
description = "A private podcast transcript library with local inference and MCP"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0", "uvicorn[standard]==0.54.0", "jinja2==3.1.6",
  "httpx==0.28.1", "mcp==2.3.0", "python-dotenv==1.2.4",
  "defusedxml==0.7.1", "python-multipart==0.0.32", "qrcode[pil]==8.2", "pyjwt[crypto]==2.15.1",
]

[project.optional-dependencies]
worker = ["mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]

[project.scripts]
transcripts = "transcripts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transcripts = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
